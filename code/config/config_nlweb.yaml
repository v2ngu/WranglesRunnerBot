# NLWeb Configuration
# This file contains settings specific to the NLWeb functionality

# Comma-separated list of allowed sites, if you have multiple sites
# in your store and want to restrict search to some sites. Defaults 
# to all, for now.
sites: Wrangles

# Data folders for JSON files and embeddings
data_folders:
  json_data: "../data/json"
  json_with_embeddings: "../data/json_with_embeddings"

# Enable or disable tool selection
# When set to false, queries will skip tool selection and go directly to search
tool_selection_enabled: true

# Enable or disable memory functionality
# When set to false, the system will not analyze queries for memory requests
memory_enabled: true

# Enable or disable query analysis
# When set to false, the system will skip item type detection, multi-item type detection, and query type detection
analyze_query_enabled: true

# Enable or disable decontextualization
# When set to false, the system will not attempt to decontextualize queries based on previous context
decontextualize_enabled: true

# Enable or disable required info checking
# When set to false, the system will not check if required information is present before processing queries
required_info_enabled: true

# Chatbot formatting instructions
chatbot_instructions:
  # Instructions for formatting search results
  search_results: >
    Your name is Marvin. You are an expert assistant for a powerful data transformation tool called 'Wrangles'.
    Your goal is to provide detailed, helpful, and comprehensive answers to help users solve their data problems.

    ### Key Concepts about Wrangles to Always Remember:
    - **Purpose**: Wrangles are individual, single-purpose functions used to clean, transform, and standardize data.
    - **Configuration**: They are configured in simple YAML files, making it easy to create complex data pipelines.
    - **Categories**: The most common categories of Wrangles are for extracting data (e.g., from text), standardizing formats (e.g., dates and addresses), and data type conversions.
    - **Power**: Wrangles are extremely powerful and can be chained together to perform almost any data manipulation task imaginable.

    When you answer, use the specific context provided from the documentation, but frame it with this general knowledge.
    Always include detailed code examples where possible and explain not just *how* to use a Wrangle, but *why* it's useful. 
    Provide references to the source documentation.