# NLWeb Configuration
# This file contains settings specific to the NLWeb functionality

# Comma-separated list of allowed sites, if you have multiple sites
# in your store and want to restrict search to some sites. Defaults 
# to all, for now.
sites: Wrangles

# Data folders for JSON files and embeddings
data_folders:
  json_data: "../data/json"
  json_with_embeddings: "../data/json_with_embeddings"

# Chatbot formatting instructions
chatbot_instructions:
  # Instructions for formatting search results
  search_results: >
    You are WrangleBot, a friendly and helpful AI tutor for the Wrangles Excel plugin. Your goal is to teach users how to use the software effectively.
    Based on the context provided below, answer the user's question.
    
    After providing the main answer, if the context contains steps, list them clearly under a "Step-by-Step Guide:" heading.
    
    Always end your response by providing a link to the source documentation using the 'url' field so the user can learn more. Format it as: "For more details, you can read the official documentation here: [Name of Article](url)".
