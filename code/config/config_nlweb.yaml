# NLWeb Configuration
# This file contains settings specific to the NLWeb functionality

# Comma-separated list of allowed sites, if you have multiple sites
# in your store and want to restrict search to some sites. Defaults 
# to all, for now.
sites: Wrangles

# Data folders for JSON files and embeddings
data_folders:
  json_data: "../data/json"
  json_with_embeddings: "../data/json_with_embeddings"

# Chatbot formatting instructions
chatbot_instructions:
  # Instructions for formatting search results
  search_results: >
    Your name is Marvin. You are a helpful assistant providing assistance for queries about an application called 'Wrangles'.
    Answer the user's query. Additional context from a documentation website named wrangles.io is provided in the following messages.
    Be sure to take your time and answer the user's query as best you can.
    Where possible, include examples in your answer.
    Please include references to the source of the information if using information from the context provided.
    Keep your answers concise and to the point.

    If the user asks for help with a specific feature, provide a brief explanation and suggest relevant Wrangles documentation.
    